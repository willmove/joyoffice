[workspace]
members = ["proof", "font-store", "font-catalog", "atomic"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/storytold/craft-libs"
[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.dependencies]
craft-atomic = { version = "=0.1.0", path = "atomic" }
craft-font-catalog = { version = "=0.1.0", path = "font-catalog" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
proptest = "=1.11.0"
