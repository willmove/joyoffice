[package]
name = "joydeck-dependency-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace]

[dependencies]
harfrust = "=0.8.4"
skrifa = "=0.42.1"
krilla = { version = "=0.8.2", default-features = false }
zip = { version = "=9.0.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
vello_cpu = "=0.2.0"
vello_common = { version = "=0.2.0", default-features = false }
kurbo = "=0.13.1"
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = false
