[package]
name = "joyword-recovery-journal"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace]

[dependencies]
crc32fast = "=1.5.2"
sha2 = "=0.10.9"
joyoffice-opc = { path = "../../crates/joyoffice-opc" }
joyword-docx = { path = "../../crates/joyword-docx" }
joyword-engine = { path = "../../crates/joyword-engine" }
joyword-model = { path = "../../crates/joyword-model" }
joyword-shell = { path = "../../crates/joyword-shell" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
