[package]
name = "joyword-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[dependencies]
joyword-docx.workspace = true
joyword-fonts.workspace = true
joyword-geom.workspace = true
rustix.workspace = true
unicode-segmentation.workspace = true
serde.workspace = true
tempfile.workspace = true
joyword-engine = { path = "../joyword-engine" }
joyword-layout = { path = "../joyword-layout" }
joyword-render = { path = "../joyword-render" }
joyword-pdf = { path = "../joyword-pdf" }
joyoffice-opc.workspace = true
sha2.workspace = true
crc32fast.workspace = true
serde_json.workspace = true
[dev-dependencies]
hayro-cmap = "=0.1.1"
hayro-interpret = { version = "=0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-syntax = "=0.7.2"
kurbo.workspace = true
tempfile.workspace = true
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[target.'cfg(unix)'.dependencies]
xattr.workspace = true
[target.'cfg(windows)'.dependencies]
winsafe.workspace = true
