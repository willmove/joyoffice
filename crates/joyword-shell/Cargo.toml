[package]
name = "joyword-shell"
description = "JoyWord application shell without UI: commands, localization, preferences and open documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Opt-in AI runtime. Core editing stays available with `--no-default-features`
# and with the default build, which does not enable this feature.
ai = ["dep:joyword-agent"]

[dependencies]
crc32fast.workspace = true
joyword-agent = { workspace = true, optional = true }
joyoffice-opc.workspace = true
joyword-docx.workspace = true
joyword-engine.workspace = true
joyword-model.workspace = true
rustix.workspace = true
tempfile.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(unix)'.dependencies]
xattr.workspace = true

[target.'cfg(windows)'.dependencies]
winsafe.workspace = true

[lints]
workspace = true
