[package]
name = "joyword-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

 description = "JoyWord MCP server: every command as a tool, headless or bridged to the running app"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
joyword-model = { workspace = true }
joyword-engine = { workspace = true }
joyword-render = { workspace = true }
joyword-control-key = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
