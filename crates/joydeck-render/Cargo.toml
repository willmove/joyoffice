[package]
name = "joydeck-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "DeckCraft renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[features]
transition-gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[lints]
workspace = true

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"], optional = true }
pollster = { version = "=0.4.0", optional = true }
bytemuck = { version = "=1.25.2", features = ["derive"], optional = true }
joydeck-geom = { workspace = true }
joydeck-color = { workspace = true }
joydeck-metafile = { workspace = true }
joydeck-model = { workspace = true }
joydeck-anim = { workspace = true }
joydeck-fonts = { workspace = true }
joydeck-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
log = { workspace = true }
kurbo = { workspace = true, features = ["serde"] }
skrifa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
