[package]
name = "joydeck-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "DeckCraft renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
joydeck-geom = { workspace = true }
joydeck-color = { workspace = true }
joydeck-metafile = { workspace = true }
joydeck-model = { workspace = true }
joydeck-anim = { workspace = true }
joydeck-fonts = { workspace = true }
joydeck-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
