[package]
name = "joyword-render"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "WordCraft rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
joyword-geom = { workspace = true, features = ["image"] }
joyword-model = { workspace = true }
joyword-fonts = { workspace = true }
joyword-layout = { workspace = true }
joyword-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
