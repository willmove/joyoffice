[package]
publish = false
name = "joysheet-calc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "GridCraft calculation engine: dependency graph, recalculation, evaluator, dynamic arrays"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
joysheet-core = { workspace = true }
joysheet-formula = { workspace = true }
joysheet-functions = { workspace = true }
joysheet-numfmt = { workspace = true }
joysheet-model = { workspace = true }
log = { workspace = true }
