[package]
name = "joyword-pdf"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "WordCraft PDF export (craft-pdf / Krilla): embedded font subsets with selectable text, links, outline, tagging"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
joyword-model = { workspace = true }
joyword-geom = { workspace = true, features = ["image"] }
joyword-fonts = { workspace = true }
joyword-layout = { workspace = true }
joyword-metafile = { workspace = true }
krilla = { workspace = true, features = ["raster-images"] }
kurbo = { workspace = true }
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock (`SystemTime::now()` panics on wasm32-unknown-unknown).
js-sys = "0.3"

[dev-dependencies]
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
