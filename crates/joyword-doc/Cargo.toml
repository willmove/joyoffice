[package]
name = "joyword-doc"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "WordCraft reader for the Word 97-2003 binary file format (.doc, [MS-DOC])"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
joyword-model = { workspace = true }
joyword-geom = { workspace = true }
cfb = { workspace = true }
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
miniz_oxide = { workspace = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
joyword-model = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
serde_json = { workspace = true }
