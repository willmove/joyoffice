[package]
name = "joyword-proof"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
repository.workspace = true
description = "First-party multilingual proofing engine for JoyWord: spelling, morphology, suggestions, localized grammar rules, hyphenation and dictionary loading"
build = "build.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
joyword-proof-rules = { workspace = true }
log = { workspace = true }
miniz_oxide = { workspace = true }
toml = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
