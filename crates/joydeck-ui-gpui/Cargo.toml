[package]
name = "joydeck-ui-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
joydeck-engine.workspace = true
joydeck-fonts.workspace = true
joydeck-model.workspace = true
joydeck-geom.workspace = true
joydeck-render.workspace = true
joydeck-text.workspace = true
gpui-kit.workspace = true
gpui_platform.workspace = true
joyoffice-ui.workspace = true
joydeck-shell.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
async-channel.workspace = true
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "=5.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["event"] }

[features]
validation = []
dev-runtime-shaders = ["gpui_platform/runtime_shaders"]

[lints]
workspace = true
