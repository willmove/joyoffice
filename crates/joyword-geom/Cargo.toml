[package]
name = "joyword-geom"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "WordCraft geometry and units: points, twips, EMU, inches, centimetres; rectangles; measurement parsing"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[features]
# Picture decoding within a memory budget (`picture`), for the crates that decode pictures.
image = ["dep:image"]

[dependencies]
image = { workspace = true, optional = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
serde = { workspace = true }
