[package]
name = "joyword-metafile"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "WordCraft metafiles: parses Windows WMF and EMF records into a neutral vector model (paths and bitmaps)"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
kurbo = { workspace = true }
thiserror = { workspace = true }
