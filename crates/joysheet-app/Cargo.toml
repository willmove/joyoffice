[package]
publish = false
name = "joysheet-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
async-channel = "=2.5.0"
joysheet-mcp.workspace = true
getrandom = "=0.4.3"
joysheet-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
joysheet-protocol = { workspace = true }

