# cargo-deny policy (T001, QUALITY-002). Passing it is not a substitute for the
# THIRD_PARTY_NOTICES and SBOM that PROVENANCE requires before any release.

[graph]
all-features = true

[advisories]
# Every RustSec advisory, including unmaintained and unsound crates, fails the
# check unless it is listed here with a reason and a revisit condition.
# 2026-10-16: the entries below are "unmaintained" notices (no vulnerability)
# reached only through the GPUI/Kit dependency tree. Kit 0.8.1 reintroduces
# instant and rustls-pemfile (2026-10-31). Revisit on every Kit/snapshot upgrade;
# none may be added for JoyWord's own direct dependencies.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 via gpui-base/gpui-component 0.8.1; unmaintained only, no vulnerability or safe update; replace upstream on next Kit upgrade; docs/joyoffice/JOYDECK-INTEGRATION.md" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 via gpui-kit-assets -> gpui-pre-reqwest; unmaintained only, no vulnerability or safe update; replace upstream on next Kit upgrade; docs/joyoffice/JOYDECK-INTEGRATION.md" },
    { id = "RUSTSEC-2024-0436", reason = "paste via metal (gpui-pre-apple) and exr/pulp (image features enabled by gpui-pre); ADR-010" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via usvg under gpui-pre; ADR-010" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via usvg/fontdb (gpui-pre, cosmic-text in gpui-pre-wgpu); ADR-010" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus under gpui-pre Linux desktop stack (accesskit_unix/ashpd/notify-rust/oo7); unmaintained notice only, no vulnerability; ADR-010" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus under gpui-pre Linux desktop stack; unmaintained notice only, no vulnerability; ADR-010" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus under gpui-pre Linux desktop stack; unmaintained notice only, no vulnerability; ADR-010" },
]

[licenses]
# Each entry is needed by at least one crate in Cargo.lock. Copyleft or notice
# obligations (MPL-2.0 in cbindgen/dwrote/option-ext, Unicode-3.0, BSD) are
# recorded in docs/joyword/PROVENANCE.md and must reach the notices file.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# Kit components use the permissive BSD Zero Clause License. Keep the new
# license acceptance limited to the two reviewed exact packages.
[[licenses.exceptions]]
name = "enum-iterator"
version = "=2.3.0"
allow = ["0BSD"]

[[licenses.exceptions]]
name = "enum-iterator-derive"
version = "=1.5.0"
allow = ["0BSD"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
