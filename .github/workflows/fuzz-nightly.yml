name: Nightly DOCX mutation checks

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/joyword-docx/**'
      - 'crates/joyword-shell/**'
      - 'scripts/joyword/verify-r8.py'
      - '.github/workflows/fuzz-nightly.yml'

permissions:
  contents: read

# Current reader smoke. The legacy coverage-guided harness targets the
# pre-R8 model; see docs/joyoffice/JOYWORD-R8-HANDOFF.md.
jobs:
  docx-mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build headless CLI
        run: cargo build --locked -p joyword-cli
      - name: Bounded malformed DOCX campaign
        run: python3 scripts/joyword/verify-r8.py target/debug/joyword-cli --mutations 128
