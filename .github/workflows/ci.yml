name: JoyWord CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (T001); the comment names
# the release. scripts/check_docs.py rejects unpinned `uses:` references.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: native ARM64 build of the GPUI app (T005).
        os: [macos-15, windows-2022, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # The Windows job also compiles the fixed-font examples after the product build.
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 60 || 45 }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev libxcb-xkb-dev libx11-xcb-dev libvulkan-dev libssl-dev libasound2-dev
      - name: macOS Metal toolchain (required for distribution builds)
        if: runner.os == 'macOS'
        run: |
          xcode-select --print-path
          xcrun --find metal
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: R8 migration documentation and fixture integrity
        run: python scripts/check_docs.py
      - name: Crate boundaries, production lints and tests
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
          RUST_TEST_THREADS: '2'
        run: |
          python scripts/check_gates.py
          python scripts/check_gates.py --counterexample scripts/tests/fixtures/gate_counterexample.rs
          python -m unittest discover -s scripts/tests
          cargo xtask check joyword
      - name: Build native app and CLI
        run: cargo xtask build joyword
      - name: Open, edit, save, reopen and export a real DOCX
        run: python scripts/joyword/verify-r8.py target/debug/joyword-cli${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Fixed-font PNG and PDF goldens
        if: matrix.os == 'windows-2022' || matrix.os == 'ubuntu-24.04' || runner.os == 'macOS'
        run: cargo run --locked -p joyword-shell --example r8_render_goldens -- target/r8-render-ci

  # Headless crates cross-compiled for Xinchuang targets and run under QEMU
  # user mode (T005). This proves code generation and the glibc/new-world
  # LoongArch ABI only; it is not a run on a domestic CPU or distribution.
  cross-linux:
    name: headless tests (${{ matrix.target }}, QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker: aarch64-linux-gnu-gcc
            runner: qemu-aarch64 -L /usr/aarch64-linux-gnu
            sysroot: /usr/aarch64-linux-gnu
          - target: loongarch64-unknown-linux-gnu
            packages: gcc-14-loongarch64-linux-gnu libc6-dev-loong64-cross
            linker: loongarch64-linux-gnu-gcc-14
            runner: qemu-loongarch64 -L /usr/loongarch64-linux-gnu
            sysroot: /usr/loongarch64-linux-gnu
    env:
      CARGO_TERM_COLOR: always
      # Keep hostile-input timing guards meaningful under user-mode emulation.
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cross toolchain and QEMU user mode
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user ${{ matrix.packages }}
      - name: Fixed Rust toolchain with target
        run: rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.target }}
      - name: Headless tests under QEMU
        run: |
          prefix="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          export "${prefix}_LINKER=${{ matrix.linker }}"
          export "${prefix}_RUNNER=${{ matrix.runner }}"
          export "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=${{ matrix.linker }}"
          # The JPEG encoder panics with LSX under QEMU 8.2.2. Use scalar code for this test run.
          if [[ '${{ matrix.target }}' == loongarch64-unknown-linux-gnu ]]; then
            export "${prefix}_RUSTFLAGS=-C target-feature=-lsx"
          fi
          # CLI integration tests spawn target binaries through binfmt, outside Cargo's runner.
          export QEMU_LD_PREFIX="${{ matrix.sysroot }}"
          cargo xtask test joyword --headless --target ${{ matrix.target }}

  document-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System fonts and independent PDF readers
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils qpdf
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build headless CLI
        run: cargo build --locked -p joyword-cli
      - name: Inspect exported PDF with Poppler and qpdf
        run: python3 scripts/joyword/verify-r8.py target/debug/joyword-cli --independent-pdf --out target/r8-export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: joyword-r8-export
          path: target/r8-export

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
      # Licenses, RustSec advisories, banned crates and registry sources (deny.toml).
      - name: Dependency licenses and advisories
        run: cargo deny --locked --all-features check

  # ADR-010 supply-chain check for the individually published gpui-pre crates:
  # every file must equal the recorded Zed main-branch commit, except the
  # reviewed deviations pinned by content. Needs github.com and static.crates.io.
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: gpui-pre source provenance
        run: >-
          python scripts/verify_gpui_pre_provenance.py
          --expected-zed-rev 08cbb88a152c3751a43e853425a70e9f631a5918
          --reviewed-deviations scripts/gpui_pre_reviewed_deviations.json
