name: JoyWord foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (T001); the comment names
# the release. scripts/check_docs.py rejects unpinned `uses:` references.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: native ARM64 build of the GPUI app (T005).
        os: [macos-15, windows-2022, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Independent W09 verifies a committed production baseline.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev libxcb-xkb-dev libx11-xcb-dev libvulkan-dev libssl-dev libasound2-dev
      - name: macOS Metal toolchain (required for distribution builds)
        if: runner.os == 'macOS'
        run: |
          xcode-select --print-path
          xcrun --find metal
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Specifications, corpus registry and locale resources
        run: python scripts/check_docs.py
      - name: No-panic, layer and filesystem gates
        run: |
          python scripts/check_gates.py
          python scripts/check_gates.py --counterexample scripts/tests/fixtures/gate_counterexample.rs
      - name: Tool logic tests
        run: python -m unittest discover -s scripts/tests
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Headless crate tests (default workspace members)
        run: cargo test --locked
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Headless application adapter tests
        run: cargo test --locked -p joyword
      - name: Recovery journal experiment
        run: |
          cargo test --manifest-path experiments/recovery-journal/Cargo.toml --locked
          cargo fmt --manifest-path experiments/recovery-journal/Cargo.toml --all -- --check
          cargo clippy --manifest-path experiments/recovery-journal/Cargo.toml --all-targets --locked -- -D warnings
      - name: DOCX robustness experiment
        run: |
          cargo test --manifest-path experiments/docx-robustness/Cargo.toml --locked
          cargo fmt --manifest-path experiments/docx-robustness/Cargo.toml --all -- --check
          cargo clippy --manifest-path experiments/docx-robustness/Cargo.toml --all-targets --locked -- -D warnings
          python -m unittest discover -s experiments/docx-robustness/tests -p "test_*.py" -v
          cargo build --manifest-path experiments/docx-robustness/Cargo.toml --locked
          python experiments/docx-robustness/driver.py smoke --binary experiments/docx-robustness/target/debug/joyword-docx-robustness${{ runner.os == 'Windows' && '.exe' || '' }} --out experiments/docx-robustness/target/ci-smoke
          python experiments/docx-robustness/driver.py fuzz --binary experiments/docx-robustness/target/debug/joyword-docx-robustness${{ runner.os == 'Windows' && '.exe' || '' }} --out experiments/docx-robustness/target/ci-fuzz --seed 20261019 --iterations 200 --seconds 60 --max-corpus 128
      # The smoke line above is W09's bounded fixed-matrix mutation run (exit 1
      # on crash/timeout/invariant/protocol or an incomplete matrix); the fuzz
      # line is a time/iteration-bounded corpus-expanding run whose feedback
      # signal is the harness's own behavioral feature list. Neither is
      # coverage-guided fuzz: no code-coverage engine is installed.
      - name: Native application build (precompiled shaders)
        run: cargo build -p joyword --locked
      # GPU windows, IME, accessibility, printing and Office round-trips require
      # separate real-machine evidence. A successful job is only a build gate.

  # Headless crates cross-compiled for Xinchuang targets and run under QEMU
  # user mode (T005). This proves code generation and the glibc/new-world
  # LoongArch ABI only; it is not a run on a domestic CPU or distribution.
  cross-linux:
    name: headless tests (${{ matrix.target }}, QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker: aarch64-linux-gnu-gcc
            runner: qemu-aarch64 -L /usr/aarch64-linux-gnu
          - target: loongarch64-unknown-linux-gnu
            packages: gcc-14-loongarch64-linux-gnu libc6-dev-loong64-cross
            linker: loongarch64-linux-gnu-gcc-14
            runner: qemu-loongarch64 -L /usr/loongarch64-linux-gnu
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cross toolchain and QEMU user mode
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user ${{ matrix.packages }}
      - name: Fixed Rust toolchain with target
        run: rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.target }}
      - name: Headless tests under QEMU
        run: |
          prefix="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          export "${prefix}_LINKER=${{ matrix.linker }}"
          export "${prefix}_RUNNER=${{ matrix.runner }}"
          cargo test --locked --target ${{ matrix.target }}

  # T003: shape original text with one OFL font, render the same page scene
  # to PDF and read it back with poppler. Proves the scene's text and
  # positions reach the PDF; it is not a visual or Word-compatibility check.
  unified-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      JOYWORD_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc:2
      JOYWORD_REQUIRE_TEST_FONT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Noto CJK (OFL) and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          dpkg-query -W fonts-noto-cjk poppler-utils
          sha256sum /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Shaping and PDF tests with the required font
        run: cargo test --locked -p joyword-layout -p joyword-pdf -p joyword-render
      - name: Unified scene PDF
        run: cargo run --locked -p joyword-pdf --example unified_scene -- /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc 2 target/unified
      - name: Independent read-back (pdftotext)
        run: python3 scripts/verify_unified_pdf.py target/unified
      - name: Engine snapshot to paginated PDF and independent read-back (C05)
        run: |
          cargo run --locked -p joyword-pdf --example document_flow -- /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc 2 target/document-flow
          python3 scripts/verify_document_pdf.py target/document-flow
      - name: CPU scenes and independent PDF raster comparison (C06)
        run: |
          cargo test --locked -p joyword-render --example compare_rasters
          cargo run --locked -p joyword-render --example cpu_scene -- /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc 2 target/cpu-scene
          pdftoppm -r 144 -png target/cpu-scene/reference.pdf target/cpu-scene/pdf
          for cpu in target/cpu-scene/cpu-*.png; do
            page="${cpu##*/cpu-}"
            cargo run --locked -p joyword-render --example compare_rasters -- "$cpu" "target/cpu-scene/pdf-$page"
          done
      - name: Line and page break comparison (T004)
        run: |
          cargo run --locked -p joyword-pdf --example unified_scene -- /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc 2 target/unified-split split-third-line
          python3 scripts/compare_pdf_lines.py target/unified/scene.pdf target/unified/scene.pdf
          if python3 scripts/compare_pdf_lines.py target/unified/scene.pdf target/unified-split/scene.pdf; then
            echo "a changed line break was not detected"; exit 1
          fi
      - name: Feature scene PDFs and independent read-back
        run: |
          cargo run --locked -p joyword-cli --example feature_scenes -- /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc 2 target/feature-scenes
          python3 scripts/verify_feature_pdf.py target/feature-scenes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-scene-pdf
          path: |
            target/unified
            target/document-flow
            target/cpu-scene

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
      # Licenses, RustSec advisories, banned crates and registry sources (deny.toml).
      - name: Dependency licenses and advisories
        run: cargo deny --locked --all-features check

  # ADR-010 supply-chain check for the individually published gpui-pre crates:
  # every file must equal the recorded Zed main-branch commit, except the
  # reviewed deviations pinned by content. Needs github.com and static.crates.io.
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: gpui-pre source provenance
        run: >-
          python scripts/verify_gpui_pre_provenance.py
          --expected-zed-rev 93d745668805029476e6d7fbb19652116fed51de
          --reviewed-deviations scripts/gpui_pre_reviewed_deviations.json
