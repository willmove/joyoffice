name: JoyDeck playback diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Fixed toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Compile the unchanged H264 assertions without GPUI
        run: |
          mkdir -p artifacts/playback-diagnostic
          cargo test --locked -p joydeck-shell --test playback --no-run --message-format=json > artifacts/playback-diagnostic/build.json
      - name: Bounded reproduction and owned-process stack capture
        timeout-minutes: 3
        run: python scripts/joydeck/diagnose-playback.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: joydeck-playback-diagnostic
          path: artifacts/playback-diagnostic
          if-no-files-found: error
