name: Product release

# Product tags release independently. Historical v* tags still route to Word.
# Starting at 0.2.0, publish normal releases with curated bilingual notes.
# A release remains a draft until every platform artifact and its uploaded
# digest have been checked.
on:
  push:
    tags: ["v*", "joyword-v*", "joydeck-v*", "joysheet-v*"]
  workflow_dispatch:
    inputs:
      product:
        description: Product to package
        type: choice
        options: [joyword, joydeck, joysheet]
        default: joyword
        required: true
      version:
        description: Version declared by the selected application manifest
        required: true
        type: string
      create_tag:
        description: From main, create the product tag after verifying all packages
        type: boolean
        default: false

permissions:
  contents: write
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('{0}-v{1}', inputs.product, inputs.version) }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  resolve:
    name: Validate product and version
    runs-on: ubuntu-24.04
    outputs:
      product: ${{ steps.version.outputs.product }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - id: version
        name: Resolve product manifest version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_PRODUCT: ${{ inputs.product }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [ "$RELEASE_EVENT" = workflow_dispatch ]; then
            python tools/xtask/product.py release-version --product "$RELEASE_PRODUCT" --version "$RELEASE_VERSION" --github-output "$GITHUB_OUTPUT"
          else
            python tools/xtask/product.py release-version --tag "$RELEASE_REF" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Verify tag points to this checkout
        if: github.event_name == 'push' || !inputs.create_tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
      - name: Verify release notes and tag creation scope
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CREATE_TAG: ${{ inputs.create_tag }}
        shell: bash
        run: |
          if [ "$CREATE_TAG" = true ]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          test -s "docs/releases/$RELEASE_TAG.md"
  package:
    name: Package ${{ needs.resolve.outputs.product }} (${{ matrix.platform }} ${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, arch: x86_64}
          - {os: ubuntu-24.04-arm, platform: linux, arch: aarch64}
          - {os: macos-15, platform: macos, arch: aarch64}
          - {os: macos-15-intel, platform: macos, arch: x86_64}
          - {os: windows-2022, platform: windows, arch: x86_64}
          - {os: windows-11-arm, platform: windows, arch: aarch64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # 3.12.10 is the newest Windows ARM64 binary in setup-python's 3.12 series.
          python-version: ${{ matrix.os == 'windows-11-arm' && '3.12.10' || '3.12' }}
          architecture: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}
      - name: Linux glibc 2.28 build container (UOS 20/25 compatible)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build -t joyoffice-glibc228 - <<'DOCKERFILE'
          FROM debian:buster-slim
          RUN printf 'deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n' > /etc/apt/sources.list \
            && apt-get -o Acquire::Check-Valid-Until=false update \
            && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                 build-essential pkg-config \
                 libfontconfig1-dev libfreetype6-dev \
                 libxkbcommon-dev libxkbcommon-x11-dev \
                 libwayland-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                 libxcb-randr0-dev libxcb-xinput-dev libxcb-xkb-dev libx11-xcb-dev \
                 libvulkan-dev libasound2-dev ca-certificates \
            && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
      - name: macOS Metal toolchain
        if: runner.os == 'macOS'
        run: |
          xcode-select --print-path
          xcrun --find metal
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.11 -y --no-progress
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os == 'Linux' && 'Linux-glibc228' || runner.os }}-${{ matrix.arch }}-${{ needs.resolve.outputs.product }}-release-${{ hashFiles('Cargo.lock') }}
      - name: Build and package selected product
        shell: bash
        env:
          RELEASE_PRODUCT: ${{ needs.resolve.outputs.product }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo fetch --locked
            HOST_CARGO="$(command -v cargo)"
            TOOLCHAIN_BIN="$(dirname "$(rustup which cargo)")"
            CARGO_HOME_DIR="${CARGO_HOME:-$HOME/.cargo}"
            RUSTUP_HOME_DIR="${RUSTUP_HOME:-$HOME/.rustup}"
            mounts=(-v "$HOME:$HOME" -v "/tmp:/tmp")
            for extra in "$CARGO_HOME_DIR" "$RUSTUP_HOME_DIR" "$TOOLCHAIN_BIN" "$GITHUB_WORKSPACE"; do
              case "$extra" in
                "$HOME"|"$HOME"/*) ;;
                *) mounts+=(-v "$extra:$extra") ;;
              esac
            done
            docker rm -f joyoffice-glibc228 >/dev/null 2>&1 || true
            docker run -d --name joyoffice-glibc228 \
              -u "$(id -u):$(id -g)" \
              -e HOME="$HOME" \
              -e CARGO_HOME="$CARGO_HOME_DIR" \
              -e RUSTUP_HOME="$RUSTUP_HOME_DIR" \
              -e PATH="$TOOLCHAIN_BIN:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              -e CARGO_TERM_COLOR=always \
              "${mounts[@]}" \
              -w "$GITHUB_WORKSPACE" \
              joyoffice-glibc228 sleep infinity
            trap 'docker rm -f joyoffice-glibc228 >/dev/null 2>&1 || true' EXIT
            mkdir -p "$RUNNER_TEMP/glibc228-bin"
            cat > "$RUNNER_TEMP/glibc228-bin/cargo" <<WRAPPER
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "\${1:-}" = "build" ]; then
            exec docker exec -w "\$PWD" joyoffice-glibc228 "$TOOLCHAIN_BIN/cargo" "\$@"
          fi
          exec "$HOST_CARGO" "\$@"
          WRAPPER
            chmod +x "$RUNNER_TEMP/glibc228-bin/cargo"
            export PATH="$RUNNER_TEMP/glibc228-bin:$PATH"
          fi
          if [ "$RELEASE_PRODUCT" = "joydeck" ]; then
            cargo xtask package joydeck --release --release-layout
          else
            if [ "$RELEASE_PRODUCT" = "joysheet" ] && [ "$RUNNER_OS" = "macOS" ]; then
              export MACOSX_DEPLOYMENT_TARGET=15.0
            fi
            cargo xtask package "$RELEASE_PRODUCT" --release
          fi
      - name: Build the Word or Deck Windows installer
        if: runner.os == 'Windows' && needs.resolve.outputs.product != 'joysheet'
        shell: bash
        env:
          RELEASE_PRODUCT: ${{ needs.resolve.outputs.product }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          base="$RELEASE_PRODUCT-$RELEASE_VERSION-windows-$RELEASE_ARCH"
          if [ "$RELEASE_PRODUCT" = joydeck ]; then base="$base-release"; fi
          python scripts/package_windows.py --product "$RELEASE_PRODUCT" --version "$RELEASE_VERSION" --arch "$RELEASE_ARCH" --archive "dist/$RELEASE_PRODUCT/$base.zip" --output "dist/$RELEASE_PRODUCT/$base-setup.exe"
      - name: Verify and checksum the installer
        run: python scripts/verify_release_assets.py "dist/${{ needs.resolve.outputs.product }}" "${{ needs.resolve.outputs.product }}" "${{ needs.resolve.outputs.version }}" --prepare-installer "${{ matrix.platform }}" "${{ matrix.arch }}"
      - name: Test Windows installation, installed CLI and safe uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_PRODUCT: ${{ needs.resolve.outputs.product }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          $base = "$env:RELEASE_PRODUCT-$env:RELEASE_VERSION-windows-$env:RELEASE_ARCH"
          if ($env:RELEASE_PRODUCT -ne 'joyword') { $base += '-release' }
          ./scripts/windows/installer-smoke.ps1 -Product $env:RELEASE_PRODUCT -Installer "dist/$env:RELEASE_PRODUCT/$base-setup.exe" -Archive "dist/$env:RELEASE_PRODUCT/$base.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ needs.resolve.outputs.product }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.zip.sha256
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.dmg
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.dmg.sha256
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.deb
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.deb.sha256
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-setup.exe
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-setup.exe.sha256
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release.zip
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release.zip.sha256
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release.tar.gz
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release.tar.gz.sha256
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release-setup.exe
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release-setup.exe.sha256
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release.dmg
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release.dmg.sha256
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release.deb
            dist/${{ needs.resolve.outputs.product }}/${{ needs.resolve.outputs.product }}-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-release.deb.sha256
          if-no-files-found: error
  publish:
    name: Verify and publish selected product
    needs: [resolve, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-${{ needs.resolve.outputs.product }}-*
          path: dist
          merge-multiple: true
      - name: Verify release archives, product icons and SHA-256 files
        env:
          RELEASE_PRODUCT: ${{ needs.resolve.outputs.product }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: python scripts/verify_release_assets.py dist "$RELEASE_PRODUCT" "$RELEASE_VERSION"
      - name: Create or verify the release tag for this commit
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          ref="refs/tags/$RELEASE_TAG"
          if git ls-remote --exit-code origin "$ref"; then
            git fetch --no-tags origin "$ref"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          else
            test "$?" = 2
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA"
          fi
      - name: Create or resume a curated release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_PRODUCT: ${{ needs.resolve.outputs.product }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body,isPrerelease,isDraft > release-state.json; then
            case "$RELEASE_PRODUCT" in
              joyword) title="JoyWord v$RELEASE_VERSION" ;;
              joydeck) title="JoyDeck v$RELEASE_VERSION" ;;
              joysheet) title="JoySheet v$RELEASE_VERSION" ;;
              *) exit 1 ;;
            esac
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease=false --latest=false --title "$title" --notes-file "$notes"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body,isPrerelease,isDraft > release-state.json
          fi
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import sys
          release = json.load(open('release-state.json', encoding='utf-8'))
          notes = Path('docs/releases', os.environ['RELEASE_TAG'] + '.md').read_text(encoding='utf-8').strip()
          if '## English' not in notes or '## 中文' not in notes:
              sys.exit('Curated English and Chinese notes are required')
          if release.get('body', '').strip() != notes:
              sys.exit('Existing draft notes differ from the tagged notes')
          if not release.get('isDraft') or release.get('isPrerelease') is not False:
              sys.exit('Refusing to alter an already published release or a prerelease draft')
          PYTHON
      - name: Upload to draft and check GitHub asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > uploaded-assets.json
          python3 - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          import sys
          files = {p.name: p for p in Path('dist').iterdir() if p.is_file()}
          assets = json.load(open('uploaded-assets.json', encoding='utf-8'))['assets']
          if {a['name'] for a in assets} != set(files) or len(assets) != len(files):
              sys.exit('Uploaded asset set does not match the verified files')
          for asset in assets:
              with files[asset['name']].open('rb') as stream:
                  digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              if asset['state'] != 'uploaded' or asset.get('digest') != digest:
                  sys.exit('Uploaded digest mismatch: ' + asset['name'])
          PYTHON
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
