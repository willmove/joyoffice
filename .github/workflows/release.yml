name: Product release

# Product tags release independently. Historical v* tags still route to Word.
# Curated bilingual notes live in the tagged tree. A release remains a draft
# until every platform artifact and its uploaded digest have been checked.
on:
  push:
    tags: ["v*", "joyword-v*", "joydeck-v*"]
  workflow_dispatch:
    inputs:
      product:
        description: Product to package
        type: choice
        options: [joyword, joydeck]
        default: joyword
        required: true
      version:
        description: Version declared by the selected application manifest
        required: true
        type: string

permissions:
  contents: write
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('{0}-v{1}', inputs.product, inputs.version) }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  resolve:
    name: Validate product and version
    runs-on: ubuntu-24.04
    outputs:
      product: ${{ steps.version.outputs.product }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - id: version
        name: Resolve product manifest version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_PRODUCT: ${{ inputs.product }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [ "$RELEASE_EVENT" = workflow_dispatch ]; then
            python tools/xtask/product.py release-version --product "$RELEASE_PRODUCT" --version "$RELEASE_VERSION" --github-output "$GITHUB_OUTPUT"
          else
            python tools/xtask/product.py release-version --tag "$RELEASE_REF" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Verify tag points to this checkout
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
          test -s "docs/releases/$RELEASE_TAG.md"
  package:
    name: Package ${{ needs.resolve.outputs.product }} (${{ matrix.platform }} ${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, arch: x86_64}
          - {os: ubuntu-24.04-arm, platform: linux, arch: aarch64}
          - {os: macos-15, platform: macos, arch: aarch64}
          - {os: windows-2022, platform: windows, arch: x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev libxcb-xkb-dev libx11-xcb-dev libvulkan-dev libssl-dev libasound2-dev
      - name: macOS Metal toolchain
        if: runner.os == 'macOS'
        run: |
          xcode-select --print-path
          xcrun --find metal
      - name: Fixed Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ needs.resolve.outputs.product }}-release-${{ hashFiles('Cargo.lock') }}
      - name: Build and package selected product
        env:
          RELEASE_PRODUCT: ${{ needs.resolve.outputs.product }}
        run: cargo xtask package ${{ needs.resolve.outputs.product }} --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ needs.resolve.outputs.product }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/${{ needs.resolve.outputs.product }}/*.zip
            dist/${{ needs.resolve.outputs.product }}/*.tar.gz
            dist/${{ needs.resolve.outputs.product }}/*.sha256
          if-no-files-found: error
  publish:
    name: Verify and publish selected product
    needs: [resolve, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-${{ needs.resolve.outputs.product }}-*
          path: dist
          merge-multiple: true
      - name: Verify complete archives and SHA-256 files
        env:
          RELEASE_PRODUCT: ${{ needs.resolve.outputs.product }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: python scripts/verify_release_assets.py dist "$RELEASE_PRODUCT" "$RELEASE_VERSION"
      - name: Create or resume a curated preview draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_PRODUCT: ${{ needs.resolve.outputs.product }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body,isPrerelease,isDraft > release-state.json; then
            case "$RELEASE_PRODUCT" in
              joyword) title="JoyWord v$RELEASE_VERSION · Preview 预览版" ;;
              joydeck) title="JoyDeck v$RELEASE_VERSION · Preview 预览版" ;;
              *) exit 1 ;;
            esac
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title "$title" --notes-file "$notes"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body,isPrerelease,isDraft > release-state.json
          fi
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import sys
          release = json.load(open('release-state.json', encoding='utf-8'))
          notes = Path('docs/releases', os.environ['RELEASE_TAG'] + '.md').read_text(encoding='utf-8').strip()
          if '## English' not in notes or '## 中文' not in notes:
              sys.exit('Curated English and Chinese notes are required')
          if release.get('body', '').strip() != notes:
              sys.exit('Existing draft notes differ from the tagged notes')
          if not release.get('isDraft') or not release.get('isPrerelease'):
              sys.exit('Refusing to alter an already published or non-preview release')
          PYTHON
      - name: Upload to draft and check GitHub asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > uploaded-assets.json
          python3 - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          import sys
          files = {p.name: p for p in Path('dist').iterdir() if p.is_file()}
          assets = json.load(open('uploaded-assets.json', encoding='utf-8'))['assets']
          if {a['name'] for a in assets} != set(files) or len(assets) != len(files):
              sys.exit('Uploaded asset set does not match the verified files')
          for asset in assets:
              with files[asset['name']].open('rb') as stream:
                  digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              if asset['state'] != 'uploaded' or asset.get('digest') != digest:
                  sys.exit('Uploaded digest mismatch: ' + asset['name'])
          PYTHON
      - name: Publish completed preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
