[package]
name = "joyword-cli"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[dependencies]
joyword-engine = { path = "../../crates/joyword-engine" }
joyword-docx = { path = "../../crates/joyword-docx" }
serde_json.workspace = true
joyword-shell.workspace = true
joyword-mcp.workspace = true
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
