[package]
name = "joyword"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[features]
default = []
dev-runtime-shaders = ["gpui_platform/runtime_shaders"]
[dependencies]
joyword-ui-gpui.workspace = true
gpui_platform.workspace = true
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

