[package]
name = "joyword"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Development-only escape hatch for macOS machines without the Metal compiler.
# Release validation must also build without this feature using full Xcode.
dev-runtime-shaders = ["gpui_platform/runtime_shaders"]
# Opt-in AI toggle. Off unless requested, so `--no-default-features` and the
# default build keep the editor free of the provider runtime.
ai = ["joyword-shell/ai"]

[dependencies]
gpui-kit.workspace = true
gpui_platform.workspace = true
joyword-foundation.workspace = true
joyword-engine.workspace = true
joyword-model.workspace = true
joyword-layout.workspace = true
joyword-pdf.workspace = true
joyword-render.workspace = true
image.workspace = true
joyword-shell.workspace = true
log = "=0.4.34"

[dev-dependencies]
tempfile.workspace = true
# Already used by the pinned GPUI runtime; inspect the actual emitted nodes.
accesskit = "=0.24.1"

[lints]
workspace = true

