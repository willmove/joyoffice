[workspace]
members = [
    "apps/joydeck",
    "apps/joydeck-cli",
    "crates/joydeck-shell",
    "crates/joydeck-ui-gpui",
    "crates/joyoffice-ui",
    "tools/xtask",
]
default-members = ["crates/joydeck-shell", "apps/joydeck-cli", "tools/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/willmove/joyoffice"

[workspace.dependencies]
joydeck-shell = { path = "crates/joydeck-shell" }
joydeck-ui-gpui = { path = "crates/joydeck-ui-gpui" }
joyoffice-ui = { path = "crates/joyoffice-ui" }
gpui-kit = "=0.8.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
