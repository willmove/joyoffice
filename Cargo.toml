[workspace]
exclude = ["third-party/accesskit_windows", "third-party/craft-libs"]
members = [
    "crates/joysheet-app",
    "crates/joysheet-calc",
    "crates/joysheet-chart",
    "crates/joysheet-core",
    "crates/joysheet-engine",
    "crates/joysheet-formula",
    "crates/joysheet-functions",
    "crates/joysheet-mcp",
    "crates/joysheet-model",
    "crates/joysheet-numfmt",
    "crates/joysheet-pdf",
    "crates/joysheet-platform",
    "crates/joysheet-protocol",
    "crates/joysheet-ui-gpui",
    "crates/joysheet-xlsx",
    "apps/joysheet",
    "apps/joysheet-cli",
    "tools/joysheet",
    "tools/xtask",
    "apps/joyword-cli",
    "apps/joyword",
    "crates/joyoffice-cfb",
    "crates/joyoffice-drawingml",
    "crates/joyoffice-omml",
    "crates/joyoffice-opc",
    "crates/joyoffice-ui",
    "crates/joyword-agent",
    "crates/joyword-corpus",
    "crates/joyword-doc",
    "crates/joyword-docx",
    "crates/joyword-engine",
    "crates/joyword-layout",
    "crates/joyword-model",
    "crates/joyword-pdf",
    "crates/joyword-render",
    "crates/joyword-shell",
    "crates/joydeck-engine",
    "crates/joydeck-pdf",
    "crates/joydeck-legacy",
    "apps/joydeck",
    "apps/joydeck-cli",
    "crates/joydeck-shell",
    "crates/joydeck-metafile",
    "crates/joydeck-fonts",
    "crates/joydeck-text",
    "crates/joydeck-anim",
    "crates/joydeck-render",
    "crates/joydeck-format",
    "crates/joydeck-pptx",
    "crates/joydeck-color",
    "crates/joydeck-geom",
    "crates/joydeck-model",
    "crates/joydeck-ui-gpui",
    "crates/joyword-control-key",
    "crates/joyword-fonts",
    "crates/joyword-formats",
    "crates/joyword-geom",
    "crates/joyword-mcp",
    "crates/joyword-metafile",
    "crates/joyword-ui-gpui",
]
default-members = [
    "crates/joysheet-app",
    "crates/joysheet-calc",
    "crates/joysheet-chart",
    "crates/joysheet-core",
    "crates/joysheet-engine",
    "crates/joysheet-formula",
    "crates/joysheet-functions",
    "crates/joysheet-mcp",
    "crates/joysheet-model",
    "crates/joysheet-numfmt",
    "crates/joysheet-pdf",
    "crates/joysheet-protocol",
    "crates/joysheet-xlsx",
    "apps/joysheet-cli",
    "apps/joyword-cli",
    "crates/joyoffice-cfb",
    "crates/joyoffice-drawingml",
    "crates/joyoffice-omml",
    "crates/joyoffice-opc",
    "crates/joyword-agent",
    "crates/joyword-corpus",
    "crates/joyword-doc",
    "crates/joyword-docx",
    "crates/joyword-engine",
    "crates/joyword-layout",
    "crates/joyword-model",
    "crates/joyword-pdf",
    "crates/joyword-render",
    "crates/joyword-shell",
    "crates/joydeck-shell",
    "crates/joydeck-color",
    "crates/joydeck-geom",
    "crates/joydeck-model",
    "apps/joydeck-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/willmove/joyoffice"

[workspace.dependencies]
joysheet-app = { path = "crates/joysheet-app" }
joysheet-calc = { path = "crates/joysheet-calc" }
joysheet-chart = { path = "crates/joysheet-chart" }
joysheet-core = { path = "crates/joysheet-core" }
joysheet-engine = { path = "crates/joysheet-engine" }
joysheet-formula = { path = "crates/joysheet-formula" }
joysheet-functions = { path = "crates/joysheet-functions" }
joysheet-mcp = { path = "crates/joysheet-mcp" }
joysheet-model = { path = "crates/joysheet-model" }
joysheet-numfmt = { path = "crates/joysheet-numfmt" }
joysheet-pdf = { path = "crates/joysheet-pdf" }
joysheet-platform = { path = "crates/joysheet-platform" }
joysheet-protocol = { path = "crates/joysheet-protocol" }
joysheet-ui-gpui = { path = "crates/joysheet-ui-gpui" }
joysheet-xlsx = { path = "crates/joysheet-xlsx" }
thiserror = "=2.0.21"
log = "=0.4.34"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
aes = { version = "=0.9.3", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
rfd = "=0.17.2"
arboard = "=3.7.0"
url = "=2.5.8"
async-channel = "=2.5.0"
joydeck-model = { path = "crates/joydeck-model" }
joydeck-engine = { path = "crates/joydeck-engine" }
joydeck-shell = { path = "crates/joydeck-shell" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.154"
zip = { version = "=9.0.0", default-features = false, features = ["deflate-flate2"] }
roxmltree = "=0.21.1"
resvg = "=0.45.1"
ttf-parser = "=0.25.1"
base64 = "=0.22.1"
png = "=0.18.1"
svg2pdf = "=0.13.0"
pdf-writer = "=0.12.1"
getrandom = "=0.3.4"

# ADR-010: align with JoyDeck before workspace integration. Kit 0.8.1 pins
# gpui-pre 0.3.10 (zed@08cbb88a152c3751a43e853425a70e9f631a5918).
gpui-kit = "=0.8.1"
joyoffice-ui = { path = "crates/joyoffice-ui" }
# Kit does not expose runtime_shaders. Keep this exact platform dependency to
# forward the existing development-only shader feature; application APIs use Kit.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
joyword-agent = { path = "crates/joyword-agent", default-features = false }
joyoffice-cfb = { path = "crates/joyoffice-cfb" }
joyoffice-drawingml = { path = "crates/joyoffice-drawingml" }
joyoffice-omml = { path = "crates/joyoffice-omml" }
joyoffice-opc = { version = "=0.1.0", path = "crates/joyoffice-opc" }
joyword-corpus = { path = "crates/joyword-corpus" }
joyword-doc = { version = "=0.1.0", path = "crates/joyword-doc" }
joyword-docx = { version = "=0.1.0", path = "crates/joyword-docx" }
joyword-engine = { version = "=0.1.0", path = "crates/joyword-engine" }
joyword-layout = { version = "=0.1.0", path = "crates/joyword-layout" }
joyword-model = { version = "=0.1.0", path = "crates/joyword-model" }
joyword-pdf = { version = "=0.1.0", path = "crates/joyword-pdf" }
joyword-render = { version = "=0.1.0", path = "crates/joyword-render" }
joyword-shell = { path = "crates/joyword-shell" }
crc32fast = "=1.5.2"
harfrust = "=0.8.4"
krilla = { version = "=0.8.2", default-features = false }
read-fonts = "=0.39.2"
skrifa = "=0.42.1"
tiny-skia = "=0.11.4"
kurbo = "=0.13.1"
image = { version = "=0.25.9", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quick-xml = "=0.41.0"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
unicode-linebreak = "=0.1.5"
unicode-segmentation = "=1.13.3"
# Already in the lock via the gpui-pre snapshot. Linear-time matching only:
# the engine exposes regex find without any backtracking (ReDoS) surface.
regex = "=1.13.1"
xattr = "=1.6.1"
winsafe = { version = "=0.0.19", features = ["kernel"] }
# Already in the lock via tempfile. Direct use is the safe renameat2 /
# renamex_np wrapper (RENAME_EXCHANGE / RENAME_SWAP). No other features.
rustix = { version = "=1.1.5", features = ["std", "fs"] }

joydeck-pdf = { path = "crates/joydeck-pdf" }
joydeck-legacy = { path = "crates/joydeck-legacy" }
joydeck-color = { path = "crates/joydeck-color" }
joydeck-geom = { path = "crates/joydeck-geom" }
joydeck-ui-gpui = { path = "crates/joydeck-ui-gpui" }
joydeck-metafile = { path = "crates/joydeck-metafile" }
joydeck-fonts = { path = "crates/joydeck-fonts" }
joydeck-text = { path = "crates/joydeck-text" }
joydeck-anim = { path = "crates/joydeck-anim" }
joydeck-render = { path = "crates/joydeck-render" }
joydeck-format = { path = "crates/joydeck-format" }
joydeck-pptx = { path = "crates/joydeck-pptx" }
unicode-bidi = "=0.3.18"
vello_cpu = "=0.2.0"
vello_common = { version = "=0.2.0", default-features = false }

# JoyWord Wordcraft-derived model, layout and editor.
joyword-mcp = { path = "crates/joyword-mcp" }
joyword-control-key = { path = "crates/joyword-control-key" }
joyword-proof = { version = "=0.1.0", package = "craft-proof", path = "third-party/craft-libs/proof" }
craft-font-store = { version = "=0.1.0", path = "third-party/craft-libs/font-store" }
craft-font-catalog = { version = "=0.1.0", path = "third-party/craft-libs/font-catalog" }
joyword-fonts = { version = "=0.1.0", path = "crates/joyword-fonts" }
joyword-formats = { version = "=0.1.0", path = "crates/joyword-formats" }
wuff = "=0.2.9"
brotli-decompressor = "=5.0.3"
unicode-script = "=0.5.8"
cfb = "=0.15.0"
miniz_oxide = "=0.9.1"
encoding_rs = "=0.8.42"
chardetng = "=1.0.0"
hmac = "=0.12.1"
hmac-sha1 = { package = "hmac", version = "=0.13.0" }
zeroize = "=1.9.1"
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }
libc = "=0.2.186"
joyword-geom = { version = "=0.1.0", path = "crates/joyword-geom" }
joyword-metafile = { version = "=0.1.0", path = "crates/joyword-metafile" }
proptest = "=1.11.0"
joyword-ui-gpui = { path = "crates/joyword-ui-gpui" }


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"


[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The layout suite measures long-input scaling. Optimize this crate even when
# the rest of the test workspace uses the development profile.
[profile.test.package.joyword-layout]
opt-level = 1

# Preserve JoySheet's validated development profile and recursive-stack contract.
# Exact package overrides leave Word/Deck and shared dependencies unchanged.

[profile.dev.package.joysheet-app]
opt-level = 1

[profile.dev.package.joysheet-calc]
opt-level = 1

[profile.dev.package.joysheet-chart]
opt-level = 1

[profile.dev.package.joysheet-core]
opt-level = 1

[profile.dev.package.joysheet-engine]
opt-level = 1

[profile.dev.package.joysheet-formula]
opt-level = 1

[profile.dev.package.joysheet-functions]
opt-level = 1

[profile.dev.package.joysheet-mcp]
opt-level = 1

[profile.dev.package.joysheet-model]
opt-level = 1

[profile.dev.package.joysheet-numfmt]
opt-level = 1

[profile.dev.package.joysheet-pdf]
opt-level = 1

[profile.dev.package.joysheet-platform]
opt-level = 1

[profile.dev.package.joysheet-protocol]
opt-level = 1

[profile.dev.package.joysheet-ui-gpui]
opt-level = 1

[profile.dev.package.joysheet-xlsx]
opt-level = 1

[profile.dev.package.joysheet]
opt-level = 1

[profile.dev.package.joysheet-cli]
opt-level = 1

[profile.dev.package.joysheet-tools]
opt-level = 1

# Exact AccessKit 0.34.0 with a retained-provider HWND lifetime fix.
[patch.crates-io]
accesskit_windows = { path = "third-party/accesskit_windows" }
