[workspace]
members = [
    "crates/joydeck-engine",
    "crates/joyoffice-opc",
    "apps/joydeck",
    "apps/joydeck-cli",
    "crates/joydeck-shell",
    "crates/joydeck-metafile",
    "crates/joydeck-fonts",
    "crates/joydeck-text",
    "crates/joydeck-anim",
    "crates/joydeck-render",
    "crates/joydeck-format",
    "crates/joydeck-pptx",

    "crates/joydeck-color",
    "crates/joydeck-geom",
    "crates/joydeck-model",
    "crates/joydeck-ui-gpui",
    "crates/joyoffice-ui",
    "tools/xtask",
]
default-members = ["crates/joydeck-shell", "crates/joydeck-color", "crates/joydeck-geom", "crates/joydeck-model", "apps/joydeck-cli", "tools/xtask"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/willmove/joyoffice"

[workspace.dependencies]
joydeck-engine = { path = "crates/joydeck-engine" }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
joyoffice-opc = { path = "crates/joyoffice-opc" }
joydeck-shell = { path = "crates/joydeck-shell" }
joydeck-color = { path = "crates/joydeck-color" }
joydeck-geom = { path = "crates/joydeck-geom" }
joydeck-model = { path = "crates/joydeck-model" }
joydeck-ui-gpui = { path = "crates/joydeck-ui-gpui" }
joyoffice-ui = { path = "crates/joyoffice-ui" }
gpui-kit = "=0.8.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
unicode-segmentation = "=1.13.3"
kurbo = { version = "=0.13.1", features = ["serde"] }

joydeck-metafile = { path = "crates/joydeck-metafile" }
joydeck-fonts = { path = "crates/joydeck-fonts" }
joydeck-text = { path = "crates/joydeck-text" }
joydeck-anim = { path = "crates/joydeck-anim" }
joydeck-render = { path = "crates/joydeck-render" }
joydeck-format = { path = "crates/joydeck-format" }
joydeck-pptx = { path = "crates/joydeck-pptx" }
log = "=0.4.34"
unicode-bidi = "=0.3.18"
unicode-linebreak = "=0.1.5"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
skrifa = "=0.42.1"
harfrust = "=0.8.4"
vello_cpu = "=0.2.0"
vello_common = { version = "=0.2.0", default-features = false }
image = { version = "=0.25.9", default-features = false, features = ["png","jpeg","webp","gif","tiff","bmp"] }
quick-xml = "=0.41.0"
zip = { version = "=9.0.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
