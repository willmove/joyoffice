[workspace]
members = [
    "apps/joydeck",
    "apps/joydeck-cli",
    "crates/joydeck-model",
    "crates/joydeck-engine",
    "crates/joydeck-formats",
    "crates/joydeck-scene",
    "crates/joydeck-export",
    "crates/joydeck-platform",
    "crates/joydeck-shell",
    "apps/joyword-cli",
    "apps/joyword",
    "crates/joyoffice-cfb",
    "crates/joyoffice-drawingml",
    "crates/joyoffice-omml",
    "crates/joyoffice-opc",
    "crates/joyword-agent",
    "crates/joyword-corpus",
    "crates/joyword-doc",
    "crates/joyword-docx",
    "crates/joyword-engine",
    "crates/joyword-epub",
    "crates/joyword-foundation",
    "crates/joyword-layout",
    "crates/joyword-model",
    "crates/joyword-pdf",
    "crates/joyword-protect",
    "crates/joyword-render",
    "crates/joyword-rtf",
    "crates/joyword-shell",
    "crates/joyword-textfmt",
]
default-members = [
    "apps/joydeck-cli",
    "crates/joydeck-model",
    "crates/joydeck-engine",
    "crates/joydeck-formats",
    "crates/joydeck-scene",
    "crates/joydeck-export",
    "crates/joydeck-platform",
    "crates/joydeck-shell",
    "apps/joyword-cli",
    "crates/joyoffice-cfb",
    "crates/joyoffice-drawingml",
    "crates/joyoffice-omml",
    "crates/joyoffice-opc",
    "crates/joyword-agent",
    "crates/joyword-corpus",
    "crates/joyword-doc",
    "crates/joyword-docx",
    "crates/joyword-engine",
    "crates/joyword-epub",
    "crates/joyword-foundation",
    "crates/joyword-layout",
    "crates/joyword-model",
    "crates/joyword-pdf",
    "crates/joyword-protect",
    "crates/joyword-render",
    "crates/joyword-rtf",
    "crates/joyword-shell",
    "crates/joyword-textfmt",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/willmove/joyoffice"

[workspace.dependencies]
joydeck-model = { path = "crates/joydeck-model" }
joydeck-engine = { path = "crates/joydeck-engine" }
joydeck-formats = { path = "crates/joydeck-formats" }
joydeck-scene = { path = "crates/joydeck-scene" }
joydeck-export = { path = "crates/joydeck-export" }
joydeck-platform = { path = "crates/joydeck-platform" }
joydeck-shell = { path = "crates/joydeck-shell" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.154"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
roxmltree = "=0.21.1"
resvg = "=0.45.1"
ttf-parser = "=0.25.1"
base64 = "=0.22.1"
png = "=0.18.1"
svg2pdf = "=0.13.0"
pdf-writer = "=0.12.1"
getrandom = "=0.3.4"

# ADR-010: align with JoyDeck before workspace integration. Kit 0.8.1 pins
# gpui-pre 0.3.10 (zed@08cbb88a152c3751a43e853425a70e9f631a5918).
gpui-kit = "=0.8.1"
# Kit does not expose runtime_shaders. Keep this exact platform dependency to
# forward the existing development-only shader feature; application APIs use Kit.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
joyword-agent = { path = "crates/joyword-agent", default-features = false }
joyword-foundation = { path = "crates/joyword-foundation" }
joyword-epub = { path = "crates/joyword-epub" }
joyoffice-cfb = { path = "crates/joyoffice-cfb" }
joyoffice-drawingml = { path = "crates/joyoffice-drawingml" }
joyoffice-omml = { path = "crates/joyoffice-omml" }
joyoffice-opc = { path = "crates/joyoffice-opc" }
joyword-corpus = { path = "crates/joyword-corpus" }
joyword-doc = { path = "crates/joyword-doc" }
joyword-docx = { path = "crates/joyword-docx" }
joyword-engine = { path = "crates/joyword-engine" }
joyword-layout = { path = "crates/joyword-layout" }
joyword-model = { path = "crates/joyword-model" }
joyword-pdf = { path = "crates/joyword-pdf" }
joyword-protect = { path = "crates/joyword-protect" }
joyword-render = { path = "crates/joyword-render" }
joyword-rtf = { path = "crates/joyword-rtf" }
joyword-shell = { path = "crates/joyword-shell" }
joyword-textfmt = { path = "crates/joyword-textfmt" }
crc32fast = "=1.5.2"
harfrust = "=0.8.4"
krilla = { version = "=0.8.2", default-features = false }
read-fonts = "=0.39.2"
skrifa = "=0.42.1"
tiny-skia = "=0.11.4"
image = { version = "=0.25.9", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quick-xml = "=0.41.0"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
unicode-linebreak = "=0.1.5"
unicode-segmentation = "=1.13.3"
# Already in the lock via the gpui-pre snapshot. Linear-time matching only:
# the engine exposes regex find without any backtracking (ReDoS) surface.
regex = "=1.13.1"
xattr = "=1.6.1"
winsafe = { version = "=0.0.19", features = ["kernel"] }
# Already in the lock via tempfile. Direct use is the safe renameat2 /
# renamex_np wrapper (RENAME_EXCHANGE / RENAME_SWAP). No other features.
rustix = { version = "=1.1.5", features = ["std", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"


[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
